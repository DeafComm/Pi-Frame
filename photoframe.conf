# Photo frame settings (network share version)
# Stop and restart the frame after changing anything here.

[frame]

# How many seconds each picture stays on the screen.
picture_seconds = 8

# How pictures are sized. Nothing is ever stretched out of shape, and any
# empty space around a picture is black.
#   native     = show pictures at their real size, centered. Pictures larger
#                than the screen are shrunk to fit.
#   fullscreen = enlarge or shrink every picture to fill as much of the
#                screen as it can while keeping its proportions.
picture_mode = native

# Video volume, 0 to 100.
video_volume = 70

# Folder of videos on the SD card, organized as <year>/<Month>, for example
# videos/2012/November. A plain name means a folder next to this file
# (inside Documents). A full path such as /home/pi/MyVideos also works.
videos_folder = videos

# Wait until the Pi has the correct date and time from the internet before
# showing anything ("Waiting on date/time" on screen). yes or no.
wait_for_clock = yes

[share]

# The network share with the photos, organized as <year>/<Month>, for
# example 2012/November. If you change server or share_name, run
# setup_share.sh again so the Pi reconnects with the new values.
server = 192.168.50.115
share_name = dropbox

# Where the share appears on the Pi. setup_share.sh connects it here.
mount_point = /mnt/pi-frame-share
